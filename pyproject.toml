[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftoepub"
version = "0.2.0"
description = "Convert PDFs to reflowable EPUB 3 (real text, not page images), self-hostable with a web front"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pdfminer.six>=20240706",
  "pypdfium2>=4.30",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.optional-dependencies]
pymupdf = ["pymupdf>=1.26"]  # optional backend, AGPL-3.0: installing it makes YOUR combined install AGPL
dev = ["pymupdf>=1.26", "pypdf>=5", "cryptography>=42", "pytest>=8", "httpx>=0.27", "reportlab>=4", "lxml>=5"]

[project.scripts]
pdftoepub = "pdftoepub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftoepub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
