# Run from the repository root:  docker compose -f deploy/docker-compose.yml up --build
# Safe default: listens on localhost only and needs no token. To publish it, put Caddy/nginx in front
# (see deploy/Caddyfile.example) AND set AUTH_TOKEN. Do not change the port mapping to 0.0.0.0 without AUTH_TOKEN.
services:
  pdftoepub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pdftoepub:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pdftoepub-data:/data
    environment:
      DATA_DIR: /data
      TMPDIR: /data/tmp   # Starlette spools uploads to TMPDIR: keep them on the volume, not in RAM
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      AUTH_TOKEN: ${AUTH_TOKEN:-}   # required when exposed beyond localhost
    restart: unless-stopped
    read_only: true            # root filesystem is immutable; writes go to /data and /tmp only
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${MEM_LIMIT:-2g}   # large scanned PDFs + OCR are memory hungry: raise for big books
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pdftoepub-data:
